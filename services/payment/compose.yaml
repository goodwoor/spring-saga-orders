services:

  # ==== БД — profile db (IDEA / full docker); не стартует при голом docker compose up ====
  postgres-payment:
    image: postgres:16
    ports: [ "5434:5432" ]
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payments" ]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [ "db" ]

  # ==== Приложения — только при --profile apps ====
  payment:
    image: saga/payment:0.0.1-SNAPSHOT
    ports:
      - "8084:8084"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_started
    profiles: [ "apps" ]
