services:

  # ==== БД — profile db (IDEA / full docker); не стартует при голом docker compose up ====
  postgres-order:
    image: postgres:16
    ports: [ "5433:5432" ]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orders" ]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [ "db" ]

  # ==== Приложения — только при --profile apps ====
  order:
    image: saga/order:0.0.1-SNAPSHOT
    # Без лимита Paketo считает кучу от всей памяти Docker VM (~5,9 ГБ на каждую JVM) — 9.11 Order
    # раздулся на GET /order и уронил всю VM. С лимитом куча ≈ 400 МБ, при OOM падает только контейнер.
    mem_limit: 1g
    ports:
      - "8083:8083"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # В IDEA show-sql остаётся из application.properties; в Docker — тысячи строк/с опроса outbox.
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_started
    profiles: [ "apps" ]

# Том Docker, а не папка проекта: на диске Windows каждый коммит ждёт fdatasync ~17 мс против ~3 мс.
# Явное name — один том и в режиме IDEA, и в полном Docker.
volumes:
  postgres-order-data:
    name: saga-postgres-order-data
